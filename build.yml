name: build-exe

# สร้าง LinkRemote-Agent.exe อัตโนมัติ และสร้าง Release ชื่อ latest
# ให้มีลิงก์ดาวน์โหลดถาวร:
# https://github.com/pyoona/RDC/releases/latest/download/LinkRemote-Agent.exe
on:
  push:
    paths:
      - "control_agent.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: build exe
        run: pyinstaller --onefile --name LinkRemote-Agent --console control_agent.py

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkRemote-Agent
          path: dist/LinkRemote-Agent.exe

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          files: dist/LinkRemote-Agent.exe
